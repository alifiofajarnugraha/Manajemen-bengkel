<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Manajemen Bengkel & Steam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --app-bg: #eef2f7;
            --panel-bg: #ffffff;
            --ink: #0f172a;
            --muted: #64748b;
            --brand: #0ea5e9;
            --brand-2: #2563eb;
        }

        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            background: radial-gradient(1200px 600px at 10% -10%, #e0f2fe 0%, transparent 60%),
                        radial-gradient(900px 500px at 90% 10%, #dbeafe 0%, transparent 55%),
                        var(--app-bg);
            color: var(--ink);
        }

        .card-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(15, 23, 42, 0.06);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .soft-shadow {
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        .nav-link {
            color: #94a3b8;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            color: #7dd3fc;
            background: rgba(148, 163, 184, 0.08);
        }

        .nav-active {
            color: #ffffff;
            background: rgba(148, 163, 184, 0.14);
            border-left: 3px solid #38bdf8;
        }

        .table-head {
            background: #0f172a;
            color: #ffffff;
        }
    </style>
</head>
<body class="leading-normal tracking-normal">

    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="bg-slate-900 shadow-xl h-16 fixed bottom-0 md:relative md:h-screen z-10 w-full md:w-64 flex md:flex-col justify-between md:justify-start">
            <div class="md:mt-12 md:w-48 md:mx-auto px-4 md:px-0 text-center md:text-left">
                <h1 class="text-white text-xl md:text-2xl font-extrabold hidden md:block">Bengkel<span class="text-sky-400">App</span></h1>
            </div>
            <ul class="flex md:flex-col text-white w-full md:mt-8">
                <li class="flex-1 md:w-full">
                    <a href="index.html" class="nav-link nav-active block py-3 md:py-4 px-4"><i class="fas fa-tachometer-alt pr-0 md:pr-3"></i><span class="hidden md:inline">Dashboard</span></a>
                </li>
                <li class="flex-1 md:w-full">
                    <a href="pos.html" class="nav-link block py-3 md:py-4 px-4"><i class="fas fa-cash-register pr-0 md:pr-3"></i><span class="hidden md:inline">Kasir & Transaksi</span></a>
                </li>
                <li class="flex-1 md:w-full">
                    <a href="inventory.html" class="nav-link block py-3 md:py-4 px-4"><i class="fas fa-boxes pr-0 md:pr-3"></i><span class="hidden md:inline">Inventori</span></a>
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content flex-1 mt-12 md:mt-2 pb-24 md:pb-5">
            <div class="pt-6 px-6">
                <div class="rounded-3xl bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 p-5 soft-shadow text-2xl text-white">
                    <h1 class="font-bold pl-1">Dashboard</h1>
                </div>
            </div>

            <div class="flex flex-wrap" id="dashboard-content">
                <!-- Dashboard Controls (Filter, Export, Reset) -->
                <div class="w-full px-6 pt-6 flex flex-col md:flex-row gap-4 items-end justify-between">
                    <div class="flex flex-wrap gap-4 items-end">
                        <div>
                            <label class="block text-slate-700 text-sm font-semibold mb-2">Dari Tanggal</label>
                            <input type="date" id="filter-start" class="shadow border border-slate-200 rounded-lg py-2 px-3 text-slate-700 focus:outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-slate-700 text-sm font-semibold mb-2">Sampai Tanggal</label>
                            <input type="date" id="filter-end" class="shadow border border-slate-200 rounded-lg py-2 px-3 text-slate-700 focus:outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <button onclick="applyDateFilter()" class="bg-sky-500 hover:bg-sky-600 text-white font-semibold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline">Tampilkan</button>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg focus:outline-none"><i class="fas fa-file-excel mr-2"></i>Export Excel</button>
                        <button onclick="resetTransactions()" class="bg-rose-600 hover:bg-rose-700 text-white font-semibold py-2 px-4 rounded-lg focus:outline-none"><i class="fas fa-trash-alt mr-2"></i>Reset Riwayat</button>
                    </div>
                </div>

                <!-- Notifications Alert Area -->
                <div class="w-full px-6 pt-4" id="notification-area"></div>

                <!-- Metrics -->
                <div class="w-full md:w-1/2 xl:w-1/4 p-4 md:p-6">
                    <div class="card-panel rounded-2xl p-4 md:p-5">
                        <div class="flex flex-row items-center">
                            <div class="flex-shrink pr-3 md:pr-4">
                                <div class="rounded-xl md:rounded-2xl p-3 md:p-4 bg-emerald-500"><i class="fas fa-wallet text-xl md:text-3xl text-white"></i></div>
                            </div>
                            <div class="flex-1 text-right md:text-center">
                                <h2 class="font-semibold uppercase text-slate-600 text-xs md:text-sm">Keuntungan Hari Ini</h2>
                                <p class="font-bold text-xl md:text-2xl mt-1" id="daily-profit">Rp 0</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Gaji Tukang Bengkel -->
                <div class="w-full md:w-1/2 xl:w-1/4 p-4 md:p-6">
                    <div class="card-panel rounded-2xl p-4 md:p-5">
                        <div class="flex flex-row items-center">
                            <div class="flex-shrink pr-3 md:pr-4">
                                <div class="rounded-xl md:rounded-2xl p-3 md:p-4 bg-blue-600"><i class="fas fa-tools text-xl md:text-3xl text-white"></i></div>
                            </div>
                            <div class="flex-1 text-right md:text-center">
                                <h2 class="font-semibold uppercase text-slate-600 text-xs md:text-sm">Gaji (Bengkel)</h2>
                                <p class="font-bold text-xl md:text-2xl mt-1" id="salary-mechanic">Rp 0</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Gaji Tukang Steam -->
                <div class="w-full md:w-1/2 xl:w-1/4 p-4 md:p-6">
                    <div class="card-panel rounded-2xl p-4 md:p-5">
                        <div class="flex flex-row items-center">
                            <div class="flex-shrink pr-3 md:pr-4">
                                <div class="rounded-xl md:rounded-2xl p-3 md:p-4 bg-indigo-600"><i class="fas fa-tint text-xl md:text-3xl text-white"></i></div>
                            </div>
                            <div class="flex-1 text-right md:text-center">
                                <h2 class="font-semibold uppercase text-slate-600 text-xs md:text-sm">Gaji (Steam)</h2>
                                <p class="font-bold text-xl md:text-2xl mt-1" id="salary-steam">Rp 0</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Total Pengeluaran -->
                <div class="w-full md:w-1/2 xl:w-1/4 p-4 md:p-6">
                    <div class="card-panel rounded-2xl p-4 md:p-5">
                        <div class="flex flex-row items-center">
                            <div class="flex-shrink pr-3 md:pr-4">
                                <div class="rounded-xl md:rounded-2xl p-3 md:p-4 bg-rose-500"><i class="fas fa-shopping-cart text-xl md:text-3xl text-white"></i></div>
                            </div>
                            <div class="flex-1 text-right md:text-center">
                                <h2 class="font-semibold uppercase text-slate-600 text-xs md:text-sm">Total Pengeluaran</h2>
                                <p class="font-bold text-xl md:text-2xl mt-1" id="total-expense">Rp 0</p>
                                <p class="text-xs text-gray-500 font-semibold" id="total-expense-items">0 Barang</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Grafik Area -->
                <div class="w-full p-4 md:p-6">
                    <div class="card-panel rounded-2xl p-4 md:p-5">
                        <h2 class="font-bold text-slate-800 mb-4 text-sm md:text-base">Grafik Keuntungan & Gaji Harian</h2>
                        <div class="relative h-64 w-full">
                            <canvas id="dashboardChart" class="w-full h-full"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (TBD for real deployment) & Logic -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
