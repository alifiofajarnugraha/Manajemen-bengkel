<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir - Manajemen Bengkel & Steam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --app-bg: #eef2f7;
            --panel-bg: #ffffff;
            --ink: #0f172a;
            --muted: #64748b;
            --brand: #0ea5e9;
            --brand-2: #2563eb;
        }

        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            background: radial-gradient(1200px 600px at 10% -10%, #e0f2fe 0%, transparent 60%),
                        radial-gradient(900px 500px at 90% 10%, #dbeafe 0%, transparent 55%),
                        var(--app-bg);
            color: var(--ink);
        }

        .card-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(15, 23, 42, 0.06);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .soft-shadow {
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        .nav-link {
            color: #94a3b8;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            color: #7dd3fc;
            background: rgba(148, 163, 184, 0.08);
        }

        .nav-active {
            color: #ffffff;
            background: rgba(148, 163, 184, 0.14);
            border-left: 3px solid #38bdf8;
        }

        .table-head {
            background: #0f172a;
            color: #ffffff;
        }
    </style>
</head>
<body class="leading-normal tracking-normal">

    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="bg-slate-900 shadow-xl h-16 fixed bottom-0 md:relative md:h-screen z-10 w-full md:w-64 flex md:flex-col justify-between md:justify-start">
            <div class="md:mt-12 md:w-48 md:mx-auto px-4 md:px-0 text-center md:text-left">
                <h1 class="text-white text-xl md:text-2xl font-extrabold hidden md:block">Bengkel<span class="text-sky-400">App</span></h1>
            </div>
            <ul class="flex md:flex-col text-white w-full md:mt-8">
                <li class="flex-1 md:w-full">
                    <a href="index.html" class="nav-link block py-3 md:py-4 px-4"><i class="fas fa-tachometer-alt pr-0 md:pr-3"></i><span class="hidden md:inline">Dashboard</span></a>
                </li>
                <li class="flex-1 md:w-full">
                    <a href="pos.html" class="nav-link nav-active block py-3 md:py-4 px-4"><i class="fas fa-cash-register pr-0 md:pr-3"></i><span class="hidden md:inline">Kasir & Transaksi</span></a>
                </li>
                <li class="flex-1 md:w-full">
                    <a href="inventory.html" class="nav-link block py-3 md:py-4 px-4"><i class="fas fa-boxes pr-0 md:pr-3"></i><span class="hidden md:inline">Inventori</span></a>
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content flex-1 mt-12 md:mt-2 pb-24 md:pb-5">
            <div class="pt-6 px-6">
                <div class="rounded-3xl bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 p-5 soft-shadow text-2xl text-white">
                    <h1 class="font-bold pl-1">Kasir & Tambah Transaksi</h1>
                </div>
            </div>

            <div class="flex flex-col xl:flex-row p-6 gap-6">
                <!-- Transaction Form Area -->
                <div class="w-full xl:w-2/3">
                    <div class="card-panel rounded-2xl p-6">
                        <h2 class="text-xl font-bold mb-4">Input Layanan / Jasa</h2>
                        <form id="form-transaction">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-slate-700 text-sm font-semibold mb-2">Pilih Pekerja (Tukang)</label>
                                    <select id="pos-worker" class="shadow border border-slate-200 rounded-lg w-full py-2 px-3 text-slate-700 leading-tight focus:outline-none focus:border-sky-500">
                                        <option value="mechanic">Bapak A (Tukang Bengkel)</option>
                                        <option value="steam">Bapak B (Tukang Steam)</option>
                                    </select>
                                </div>
                            </div>
                            
                            <hr class="mb-4">

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 items-end">
                                <div>
                                    <label class="block text-slate-700 text-sm font-semibold mb-2">Pilih Barang (Oli/Part)</label>
                                    <select id="pos-item" class="shadow border border-slate-200 rounded-lg w-full py-2 px-3 text-slate-700 leading-tight focus:outline-none focus:border-sky-500">
                                        <option value="">-- Tanpa Barang --</option>
                                        <!-- Looped via JS -->
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-slate-700 text-sm font-semibold mb-2">Biaya Jasa (Gaji Masuk Pekerja)</label>
                                    <input type="number" id="pos-service-fee" placeholder="0" class="shadow border border-slate-200 rounded-lg w-full py-2 px-3 text-slate-700 leading-tight focus:outline-none focus:border-sky-500">
                                </div>
                                <div>
                                    <button type="button" id="btn-add-item" class="bg-emerald-500 hover:bg-emerald-600 w-full text-white font-semibold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline">
                                        Tambahkan ke Keranjang
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="card-panel rounded-2xl p-6 mt-6">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-xl font-bold">Keranjang & Ringkasan</h2>
                        </div>
                        <table class="min-w-full bg-white mb-4">
                            <thead class="table-head">
                                <tr>
                                    <th class="py-2 px-4 text-left">Deskripsi</th>
                                    <th class="py-2 px-4 text-right">Barang/Part</th>
                                    <th class="py-2 px-4 text-right">Biaya Jasa</th>
                                    <th class="py-2 px-4 text-right">Subtotal</th>
                                    <th class="py-2 px-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="cart-list" class="text-gray-700">
                                <!-- Cart Items via JS -->
                            </tbody>
                        </table>
                        <div class="text-right border-t pt-4">
                            <h2 class="text-2xl font-bold text-slate-800">Total: <span id="cart-total">Rp 0</span></h2>
                            <button id="btn-checkout" class="mt-4 bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 px-8 rounded-lg text-lg">
                                Proses Pembayaran Selesai
                            </button>
                        </div>
                    </div>
                </div>

                <!-- History Area -->
                <div class="w-full xl:w-1/3">
                    <div class="card-panel rounded-2xl p-6">
                        <h2 class="text-xl font-bold mb-4">Riwayat Hari Ini</h2>
                        <ul id="transaction-history" class="divide-y divide-slate-200">
                            <!-- Transactions via JS -->
                        </ul>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
